<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GEARHEART #1: The Forge Awakens</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="bar">
  <h1>GEAR<span>HEART</span> <small>#1 The Forge Awakens</small></h1>
  <nav class="nav" aria-label="Page navigation">
    <button id="prev" type="button" aria-label="Previous page">&#9664; Prev</button>
    <span id="indicator" aria-live="polite">Prologue</span>
    <button id="next" type="button" aria-label="Next page">Next &#9654;</button>
    <button id="labbtn" type="button">Shield Lab</button>
  </nav>
</header>
<main id="stage" class="stage"></main>
<div id="lab" class="lab-overlay" hidden="hidden" role="dialog" aria-label="Shield Lab">
  <div class="lab-box">
    <div class="lab-top">
      <strong>SHIELD LAB</strong>
      <button id="labstate" type="button" aria-pressed="false">State: DORMANT</button>
      <button id="labauto" type="button" aria-pressed="false">Auto-fire: OFF</button>
      <span>Blocked: <b id="labcount">0</b></span>
      <button id="labclose" type="button">Close (Esc)</button>
    </div>
    <div id="labstage" class="lab-stage"></div>
    <p class="lab-help">Hover to aim: the nearest planet gear slides into the line of fire. Click to fire a projectile. Toggle ACTIVE to spin the gears.</p>
  </div>
</div>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
